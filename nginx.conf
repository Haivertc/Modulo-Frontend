# Plantilla de nginx: ${API_GATEWAY_URL} se reemplaza al arrancar el contenedor.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El frontend llama a /api en su mismo origen (environment.ts): nginx lo reenvía al
    # API Gateway, igual que proxy.conf.json en desarrollo. Así no hace falta CORS.
    location /api/ {
        proxy_pass ${API_GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Subidas a S3 vía Gateway: PDF hasta 10 MB (nginx limita a 1 MB por defecto)
        client_max_body_size 11m;
    }

    # Archivos con hash en el nombre: se pueden cachear sin límite
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Soporte SPA: cualquier ruta del router de Angular devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
